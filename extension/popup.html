<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chrome-to-Terminal</title><link rel="stylesheet" href="popup.css"></head><body><header class="brand"><div class="mark">▶</div><div><strong>Chrome-to-Terminal</strong><span>Web → Terminal</span></div></header><main><section class="card"><label for="shell">Terminal</label><select id="shell"><option value="auto">Auto-detect</option><option value="bash">Bash / Zsh</option><option value="powershell">PowerShell</option><option value="cmd">Command Prompt</option></select><label for="command">Selected / pasted command</label><textarea id="command" rows="7" placeholder="Select text on a webpage, or paste a command here…"></textarea><button id="run" class="primary">Run in Terminal</button><div id="status" class="status"></div></section><section class="hint"><div class="hint-icon">⌘</div><div><strong>Fastest workflow</strong><p>Select a command on any webpage → right-click → <b>Run in Terminal</b>.</p></div></section><button id="settings" class="link">Settings &amp; setup</button></main><script src="popup.js"></script></body></html>
