name: Build and Release Run Anywhere

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build connectors
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            goos: linux
            goarch: amd64
          - os: windows
            goos: windows
            goarch: amd64
          - os: macos-intel
            goos: darwin
            goarch: amd64
          - os: macos-arm64
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          cd connectors/go
          go build -trimpath -ldflags="-s -w" -o "../../dist/run-anywhere-host-${{ matrix.os }}${ext}" .
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: dist/run-anywhere-host-${{ matrix.os }}*

  package:
    name: Package and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: native-*
          merge-multiple: true

      - name: Package extension
        run: |
          mkdir -p release
          (cd extension && zip -r "../release/Run-Anywhere-Chrome-Web-Store-${GITHUB_REF_NAME#v}.zip" .)

      - name: Package Linux connector
        run: |
          mkdir -p linux-package/linux
          cp dist/run-anywhere-host-linux linux-package/linux/run-anywhere-host
          chmod 755 linux-package/linux/run-anywhere-host
          cp connectors/linux/install.sh linux-package/install.sh
          chmod 755 linux-package/install.sh
          tar -czf "release/Run-Anywhere-Linux-Connector-${GITHUB_REF_NAME#v}.tar.gz" -C linux-package .

      - name: Package Windows connector
        run: |
          mkdir -p win-package/windows
          cp dist/run-anywhere-host-windows.exe win-package/windows/run-anywhere-host.exe
          cp connectors/windows/install.ps1 win-package/install.ps1
          (cd win-package && zip -r "../release/Run-Anywhere-Windows-Connector-${GITHUB_REF_NAME#v}.zip" .)

      - name: Package macOS connector
        run: |
          mkdir -p mac-package/macos
          cp dist/run-anywhere-host-macos-intel mac-package/macos/run-anywhere-host-intel
          cp dist/run-anywhere-host-macos-arm64 mac-package/macos/run-anywhere-host-arm64
          cp connectors/macos/install.sh mac-package/install.sh
          chmod 755 mac-package/install.sh mac-package/macos/*
          tar -czf "release/Run-Anywhere-macOS-Connector-${GITHUB_REF_NAME#v}.tar.gz" -C mac-package .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Run Anywhere ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
